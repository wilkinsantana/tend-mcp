[project]
name = "tend-mcp"
version = "0.1.0"
description = "MCP server that lets coding agents operate a tend.host panel through scoped API tokens."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "tend.host contributors" }]
keywords = ["mcp", "tend", "tend.host", "agents", "self-hosting", "docker"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "mcp>=2.0,<3",
  "httpx>=0.27",
]

[project.scripts]
tend-mcp = "tend_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/wilkinsantana/tend-mcp"
Panel = "https://github.com/wilkinsantana/tend.host"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tend_mcp"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 125
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = false
ignore_missing_imports = true

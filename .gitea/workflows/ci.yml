name: tend-mcp Gitea CI

# Development branches validate through PRs; main validates pushes.
# Do not also trigger feature pushes: that queues the same candidate twice.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint, typecheck, test
    runs-on: tend-ci
    steps:
      - uses: https://gitea.com/actions/checkout@v7
      - uses: https://gitea.com/actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --quiet uv
      - run: uv sync --frozen
      - run: uv run ruff check src tests scripts/sign-runtime-release.py scripts/pack-runtime-service.py
      - run: uv run ruff format --check src tests scripts/sign-runtime-release.py scripts/pack-runtime-service.py
      - run: uv run mypy src scripts/sign-runtime-release.py scripts/pack-runtime-service.py scripts/normalize-runtime-image.py scripts/check-worker-image.py
      - run: uv run ruff check scripts/normalize-runtime-image.py scripts/check-worker-image.py
      - run: uv run ruff format --check scripts/normalize-runtime-image.py scripts/check-worker-image.py
      - run: uv run pytest -q
      - run: uv run ruff check scripts/pack-native-ui.py scripts/record-component-artifacts.py scripts/publish-component-release.py
      - run: uv run ruff format --check scripts/pack-native-ui.py scripts/record-component-artifacts.py scripts/publish-component-release.py
      - run: uv run mypy scripts/pack-native-ui.py scripts/record-component-artifacts.py scripts/publish-component-release.py
      - uses: https://gitea.com/actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check && npm test
      - name: Install disposable browser dependencies
        run: npx playwright install --with-deps chromium
      - name: Packaged native UI browser contract (intercepted APIs)
        run: npm run test:browser
      - name: Build distribution
        run: uv build

  worker_image:
    name: Isolated worker image and service package
    runs-on: tend-ci
    needs: [test]
    steps:
      - uses: https://gitea.com/actions/checkout@v7
        with:
          persist-credentials: false
      - uses: https://gitea.com/actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build, normalize, and probe disposable worker image
        run: python scripts/check-worker-image.py --output dist/worker-image
      # Separate immutable core checkout, used only by a subprocess contract
      # test. No source is imported into the MCP package or worker image.
      - name: Check out verified core contract fixture
        uses: https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          github-server-url: https://github.com
          repository: wilkinsantana/tend.host
          ref: 05eda937f9328ea49616d9d8bc0531ce21bc23f2
          path: .core-contract
          ssh-key: ${{ secrets.CORE_COMPAT_READ_KEY }}
          persist-credentials: false
      - name: Verify immutable core checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .core-contract rev-parse HEAD)" = 05eda937f9328ea49616d9d8bc0531ce21bc23f2
          test -z "$(git -C .core-contract status --porcelain)"
      - name: Install isolated core fixture dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .core-fixture-venv
          .core-fixture-venv/bin/python -m pip install --quiet -r .core-contract/backend/requirements-dev.txt
      - name: Real publisher-package core lifecycle acceptance
        shell: bash
        env:
          TEND_MCP_TEST_LOCAL_DOCKER: "1"
          TEND_MCP_TEST_LOCAL_SSH: "1"
          TEND_MCP_TEST_PLATFORM: linux/amd64
        run: |
          set -euo pipefail
          export TEND_MCP_TEST_SERVICE_PACKAGE="$PWD/dist/worker-image/service.zip"
          python="$PWD/.core-fixture-venv/bin/python"
          cd .core-contract/backend
          "$python" -m pytest -q --junitxml="$RUNNER_TEMP/mcp-lifecycle.xml" \
            'tests/test_mcp_docker_integration.py::test_real_import_supervision_lost_reply_and_cleanup[local]' \
            'tests/test_mcp_docker_integration.py::test_real_import_supervision_lost_reply_and_cleanup[ssh]'
          "$python" - "$RUNNER_TEMP/mcp-lifecycle.xml" <<'PYTHON'
          import sys
          import xml.etree.ElementTree as ET
          cases = list(ET.parse(sys.argv[1]).getroot().iter('testcase'))
          assert len(cases) == 2, 'both lifecycle transports must execute'
          assert all(not any(case.find(tag) is not None for tag in ('skipped', 'failure', 'error')) for case in cases), 'lifecycle skips or failures are not acceptance'
          print('Direct and pinned SSH publisher lifecycle cases passed without skips.')
          PYTHON
      - name: Actual UI archive and core HTTP contract (daemon doubles)
        shell: bash
        run: |
          set -euo pipefail
          python scripts/pack-native-ui.py --output dist/worker-image/ui.zip
          export TEND_MCP_TEST_UI_PACKAGE="$PWD/dist/worker-image/ui.zip"
          python="$PWD/.core-fixture-venv/bin/python"
          cd .core-contract/backend
          "$python" -m pytest -q --junitxml="$RUNNER_TEMP/mcp-public-ui.xml" \
            tests/test_mcp_public_runtime.py tests/test_mcp_public_flow.py
          "$python" - "$RUNNER_TEMP/mcp-public-ui.xml" <<'PYTHON'
          import sys
          import xml.etree.ElementTree as ET
          cases = list(ET.parse(sys.argv[1]).getroot().iter('testcase'))
          assert len(cases) == 35, 'all pinned public runtime/HTTP cases must execute'
          assert all(not any(case.find(tag) is not None for tag in ('skipped', 'failure', 'error')) for case in cases), 'public UI skips or failures are not acceptance'
          print('Actual native archive/core HTTP cases passed; daemon I/O doubled in this selection.')
          PYTHON

  # Inactive until parent integration/pins, native runners, trust provisioning
  # and exact-source approval are complete. Never enable for pull requests.
  component_build:
    name: Validate immutable component packages
    needs: [test]
    if: gitea.event_name == 'push' && gitea.ref == 'refs/heads/main' && vars.COMPONENT_RELEASE_APPROVED_SHA == gitea.sha
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: tend-ci-${{ matrix.arch }}
    steps:
      - uses: https://gitea.com/actions/checkout@v7
        with:
          ref: ${{ gitea.sha }}
          persist-credentials: false
      - uses: https://gitea.com/actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Require native platform and exact clean source
        env:
          VERIFIED_SHA: ${{ gitea.sha }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          test "$(git rev-parse HEAD)" = "$VERIFIED_SHA"
          test -z "$(git status --porcelain)"
          test "$(docker version --format '{{.Server.Arch}}')" = "$TARGET_ARCH"
      - run: python scripts/check-worker-image.py --output dist/worker-image
      - name: Name validated transport without rebuilding
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist/component
          cp dist/worker-image/service.zip "dist/component/service-linux-$TARGET_ARCH.zip"
          if [ "$TARGET_ARCH" = amd64 ]; then
            python scripts/pack-native-ui.py --output dist/component/tend-mcp-ui.zip
          fi
      - uses: https://gitea.com/actions/upload-artifact@v3
        with:
          name: component-${{ gitea.sha }}-${{ matrix.arch }}
          path: dist/component/*
          retention-days: 7

  component_identity:
    needs: [component_build, worker_image]
    if: gitea.event_name == 'push' && gitea.ref == 'refs/heads/main' && vars.COMPONENT_RELEASE_APPROVED_SHA == gitea.sha
    runs-on: tend-ci
    steps:
      - uses: https://gitea.com/actions/checkout@v7
        with:
          ref: ${{ gitea.sha }}
          persist-credentials: false
      - uses: https://gitea.com/actions/download-artifact@v3
        with:
          name: component-${{ gitea.sha }}-amd64
          path: dist/component
      - uses: https://gitea.com/actions/download-artifact@v3
        with:
          name: component-${{ gitea.sha }}-arm64
          path: dist/component
      - run: python3 scripts/record-component-artifacts.py
      - uses: https://gitea.com/actions/upload-artifact@v3
        with:
          name: component-validated-${{ gitea.sha }}
          path: dist/component/*
          retention-days: 7

  component_publish:
    name: Sign and publish approved component (not source mirroring)
    needs: [test, worker_image, component_identity, publish_github]
    if: gitea.event_name == 'push' && gitea.ref == 'refs/heads/main' && vars.COMPONENT_RELEASE_APPROVED_SHA == gitea.sha
    runs-on: tend-ci
    steps:
      - uses: https://gitea.com/actions/checkout@v7
        with:
          ref: ${{ gitea.sha }}
          persist-credentials: false
      - uses: https://gitea.com/actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet uv
      - run: uv sync --frozen --group release
      - uses: https://gitea.com/actions/download-artifact@v3
        with:
          name: component-validated-${{ gitea.sha }}
          path: dist/component
      - name: Sign unchanged validated bytes and publish immutable release
        env:
          VERIFIED_SHA: ${{ gitea.sha }}
          COMPONENT_RELEASE_APPROVED_SHA: ${{ vars.COMPONENT_RELEASE_APPROVED_SHA }}
          GITEA_EVENT_NAME: ${{ gitea.event_name }}
          GITEA_REF: ${{ gitea.ref }}
          COMPONENT_RELEASE_SIGNING_KEY: ${{ secrets.COMPONENT_RELEASE_SIGNING_KEY }}
          GH_TOKEN: ${{ secrets.GH_PUBLISH_TOKEN }}
        run: uv run --group release python scripts/publish-component-release.py

  publish_github:
    name: Publish verified main to GitHub
    runs-on: tend-ci
    needs: [test, worker_image]
    if: gitea.event_name == 'push' && gitea.ref == 'refs/heads/main'
    steps:
      - uses: https://gitea.com/actions/checkout@v7
        with:
          ref: ${{ gitea.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: https://gitea.com/actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Diagnose GitHub credential access without revealing secrets
        env:
          GH_PUBLISH_TOKEN: ${{ secrets.GH_PUBLISH_TOKEN }}
        run: python scripts/check-publication-access.py
      - name: Publish the exact verified commit
        env:
          GH_PUBLISH_TOKEN: ${{ secrets.GH_PUBLISH_TOKEN }}
          VERIFIED_SHA: ${{ gitea.sha }}
          GITEA_EVENT_NAME: ${{ gitea.event_name }}
          GITEA_REF: ${{ gitea.ref }}
        run: python scripts/publish-verified-main.py

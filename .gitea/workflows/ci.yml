name: tend-mcp Gitea CI

# Development branches validate through PRs; main validates pushes.
# Do not also trigger feature pushes: that queues the same candidate twice.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint, typecheck, test
    runs-on: tend-ci
    steps:
      - uses: https://gitea.com/actions/checkout@v7
      - uses: https://gitea.com/actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --quiet uv
      - run: uv sync --frozen
      - run: uv run ruff check src tests scripts/sign-runtime-release.py scripts/pack-runtime-service.py
      - run: uv run ruff format --check src tests scripts/sign-runtime-release.py scripts/pack-runtime-service.py
      - run: uv run mypy src scripts/sign-runtime-release.py scripts/pack-runtime-service.py scripts/normalize-runtime-image.py scripts/check-worker-image.py
      - run: uv run ruff check scripts/normalize-runtime-image.py scripts/check-worker-image.py
      - run: uv run ruff format --check scripts/normalize-runtime-image.py scripts/check-worker-image.py
      - run: uv run pytest -q
      - name: Build distribution
        run: uv build

  worker_image:
    name: Isolated worker image and service package
    runs-on: tend-ci
    needs: [test]
    steps:
      - uses: https://gitea.com/actions/checkout@v7
        with:
          persist-credentials: false
      - uses: https://gitea.com/actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build, normalize, and probe disposable worker image
        run: python scripts/check-worker-image.py --output dist/worker-image
      # Separate immutable core checkout, used only by a subprocess contract
      # test. No source is imported into the MCP package or worker image.
      - name: Check out verified core contract fixture
        uses: https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          github-server-url: https://github.com
          repository: wilkinsantana/tend.host
          ref: 21a7924e5f39e08cbaf94826c710d9ef1714221f
          path: .core-contract
          ssh-key: ${{ secrets.CORE_COMPAT_READ_KEY }}
          persist-credentials: false
      - name: Verify immutable core checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .core-contract rev-parse HEAD)" = 21a7924e5f39e08cbaf94826c710d9ef1714221f
          test -z "$(git -C .core-contract status --porcelain)"
      - name: Install isolated core fixture dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .core-fixture-venv
          .core-fixture-venv/bin/python -m pip install --quiet -r .core-contract/backend/requirements-dev.txt
      - name: Real publisher-package core lifecycle acceptance
        shell: bash
        env:
          TEND_MCP_TEST_LOCAL_DOCKER: "1"
          TEND_MCP_TEST_LOCAL_SSH: "1"
          TEND_MCP_TEST_PLATFORM: linux/amd64
        run: |
          set -euo pipefail
          export TEND_MCP_TEST_SERVICE_PACKAGE="$PWD/dist/worker-image/service.zip"
          python="$PWD/.core-fixture-venv/bin/python"
          cd .core-contract/backend
          "$python" -m pytest -q --junitxml="$RUNNER_TEMP/mcp-lifecycle.xml" \
            'tests/test_mcp_docker_integration.py::test_real_import_supervision_lost_reply_and_cleanup[local]' \
            'tests/test_mcp_docker_integration.py::test_real_import_supervision_lost_reply_and_cleanup[ssh]'
          "$python" - "$RUNNER_TEMP/mcp-lifecycle.xml" <<'PYTHON'
          import sys
          import xml.etree.ElementTree as ET
          cases = list(ET.parse(sys.argv[1]).getroot().iter('testcase'))
          assert len(cases) == 2, 'both lifecycle transports must execute'
          assert all(not any(case.find(tag) is not None for tag in ('skipped', 'failure', 'error')) for case in cases), 'lifecycle skips or failures are not acceptance'
          print('Direct and pinned SSH publisher lifecycle cases passed without skips.')
          PYTHON

  publish_github:
    name: Publish verified main to GitHub
    runs-on: tend-ci
    needs: [test, worker_image]
    if: gitea.event_name == 'push' && gitea.ref == 'refs/heads/main'
    steps:
      - uses: https://gitea.com/actions/checkout@v7
        with:
          ref: ${{ gitea.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: https://gitea.com/actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Diagnose GitHub credential access without revealing secrets
        env:
          GH_PUBLISH_TOKEN: ${{ secrets.GH_PUBLISH_TOKEN }}
        run: python scripts/check-publication-access.py
      - name: Publish the exact verified commit
        env:
          GH_PUBLISH_TOKEN: ${{ secrets.GH_PUBLISH_TOKEN }}
          VERIFIED_SHA: ${{ gitea.sha }}
          GITEA_EVENT_NAME: ${{ gitea.event_name }}
          GITEA_REF: ${{ gitea.ref }}
        run: python scripts/publish-verified-main.py
